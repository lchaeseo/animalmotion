<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Motion Study</title>
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/style.css" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>
    <!-- 4. My JavaScript : 우리가 작성한 스크립트 코드 연결 -->
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="poster">
      <div class="top-text">INTERACTIVE WEB EXPERIMENT / 2026</div>

      <div class="title-area">
        <h1>ANIMAL MOTION STUDY</h1>
        <h2>An Exploration of Movement</h2>
      </div>

      <div class="graphic">
        <div class="turtle-wrapper">
          <div class="turtle" id="turtle">
            <div class="head"></div>

            <div class="body"></div>

            <div class="joint front-left">
              <div class="flipper"></div>
            </div>

            <div class="joint front-right">
              <div class="flipper"></div>
            </div>

            <div class="joint back-left">
              <div class="flipper small"></div>
            </div>

            <div class="joint back-right">
              <div class="flipper small"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="description">
        Exploring the rhythm, direction, and behavior of natural movement
        through geometric forms.
      </div>

      <div class="event-info">
        <p>DEC 10, 2026</p>
        <p>10:00 AM – 06:00 PM</p>
        <p>DIGITAL ART EXHIBITION</p>
        <p>ORGANIZED BY MYONGJI UNIVERSITY</p>
      </div>
    </div>
  </body>
</html>
